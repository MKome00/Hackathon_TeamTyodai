<!DOCTYPE html> <!-- このファイルがHTML5であることをブラウザに伝える -->

<html lang="ja"> <!-- HTML全体の開始。ページの言語を日本語に設定する -->

<head> <!-- ページの設定情報を書く部分 -->

    <meta charset="UTF-8"> <!-- 日本語の文字化けを防ぐために文字コードをUTF-8に設定する -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- スマホ画面でも正しい幅で表示できるようにする -->

    <title>ホーム</title> <!-- ブラウザのタブに表示されるタイトルを設定する -->

    <!-- 共通のCSSファイルを読み込む -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body> <!-- ブラウザに表示する内容を書く部分 -->

    <main class="page-content"> <!-- 各ページのメイン表示領域を作る -->

        <h1>🏠ホーム</h1> <!-- 現在のページ名を表示する -->

    </main>

    <nav class="bottom-nav"> <!-- 画面下部に表示するナビゲーション全体 -->

        <div class="nav-indicator"></div> <!-- 選択中のタブの後ろを滑らかに移動する角丸背景を作る -->

        <a href="{{ url_for('home') }}" class="active" data-index="0"> <!-- ホームへ移動するリンク。現在のページなのでactiveを付ける -->
            <span>ホーム</span> <!-- ナビゲーションに表示する文字 -->
        </a>

        <a href="{{ url_for('pets') }}" data-index="1"> <!-- ペットページへ移動するリンク -->
            <span>ペット</span> <!-- ナビゲーションに表示する文字 -->
        </a>

        <a href="{{ url_for('schedule') }}" data-index="2"> <!-- 予定ページへ移動するリンク -->
            <span>予定</span> <!-- ナビゲーションに表示する文字 -->
        </a>

        <a href="{{ url_for('records') }}" data-index="3"> <!-- 記録ページへ移動するリンク -->
            <span>記録</span> <!-- ナビゲーションに表示する文字 -->
        </a>

        <a href="{{ url_for('mypage') }}" data-index="4"> <!-- マイページへ移動するリンク -->
            <span>マイページ</span> <!-- ナビゲーションに表示する文字 -->
        </a>

    </nav> <!-- 下部ナビゲーションの終了 -->

    <!-- 下部ナビゲーションを滑らかに動かすJavaScriptファイルを読み込む -->
    <script src="{{ url_for('static', filename='js/nav.js') }}"></script>

</body>

</html>
