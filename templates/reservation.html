<!DOCTYPE html> <!-- このファイルがHTML5であることをブラウザに伝える -->

<html lang="ja"> <!-- HTML全体の開始。ページの言語を日本語に設定する -->

<head> <!-- ページの設定情報を書く部分 -->

    <meta charset="UTF-8"> <!-- 日本語の文字化けを防ぐために文字コードをUTF-8に設定する -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- スマホ画面でも正しい幅で表示できるようにする -->

    <title>予約</title> <!-- ブラウザのタブに予約と表示する -->

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"> <!-- 共通のCSSファイルを読み込む -->

</head> <!-- head部分を終了する -->

<body> <!-- ブラウザに表示する内容を書く部分 -->

    <main class="page-content"> <!-- 予約ページのメイン表示領域を作る -->

        <h1>📋予約</h1> <!-- 現在のページ名として予約を表示する -->

    </main> <!-- メイン表示領域を終了する -->

    <nav class="bottom-nav"> <!-- 画面下部に表示するナビゲーション全体を作る -->

        <div class="nav-indicator"></div> <!-- 選択中のタブの後ろを滑らかに移動する背景を作る -->

        <a href="{{ url_for('home') }}" data-index="0"> <!-- ホーム画面へ移動するリンク -->
            <span>ホーム</span> <!-- ナビゲーションにホームと表示する -->
        </a>

        <a href="{{ url_for('pets') }}" data-index="1"> <!-- ペット画面へ移動するリンク -->
            <span>ペット</span> <!-- ナビゲーションにペットと表示する -->
        </a>

        <a href="{{ url_for('calendar') }}" data-index="2"> <!-- カレンダー画面へ移動するリンク -->
            <span>カレンダー</span> <!-- ナビゲーションにカレンダーと表示する -->
        </a>

        <a href="{{ url_for('records') }}" data-index="3"> <!-- 記録画面へ移動するリンク -->
            <span>記録</span> <!-- ナビゲーションに記録と表示する -->
        </a>

        <a href="{{ url_for('reservation') }}" class="active" data-index="4"> <!-- 予約画面へ移動するリンク -->
            <span>予約</span> <!-- ナビゲーションに予約と表示する -->
        </a>

    </nav> <!-- 下部ナビゲーションを終了する -->

    <script src="{{ url_for('static', filename='js/nav.js') }}"></script> <!-- ナビゲーション用JavaScriptを読み込む -->

</body> <!-- body部分を終了する -->

</html> <!-- HTML全体を終了する -->
