<!DOCTYPE html> <!-- このファイルがHTML5であることをブラウザに伝える -->

<html lang="ja"> <!-- HTML全体の開始。ページの言語を日本語に設定する -->

<head> <!-- ページの設定情報を書く部分 -->

    <meta charset="UTF-8"> <!-- 日本語の文字化けを防ぐために文字コードをUTF-8に設定する -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- スマホ画面でも正しい幅で表示できるようにする -->

    <title>カレンダー</title> <!-- ブラウザのタブにカレンダーと表示する -->

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"> <!-- 共通のCSSファイルを読み込む -->

</head> <!-- head部分を終了する -->

<body> <!-- ブラウザに表示する内容を書く部分 -->

    <main class="page-content"> <!-- カレンダーページのメイン表示領域を作る -->

        <h1>📅カレンダー</h1> <!-- 現在のページ名としてカレンダーを表示する -->

    </main> <!-- メイン表示領域を終了する -->

    <nav class="bottom-nav"> <!-- 画面下部に表示するナビゲーション全体を作る -->

        <div class="nav-indicator" aria-hidden="true"> <!-- 現在選択中のタブを示す移動する肉球アイコン全体を作る -->

            <svg class="nav-paw" viewBox="0 0 100 90"> <!-- 肉球を描画するSVG領域を作る -->

                <ellipse cx="21" cy="31" rx="11" ry="16" transform="rotate(-18 21 31)"></ellipse> <!-- 左端の指を少し外側へ傾けて描く -->

                <ellipse cx="41" cy="20" rx="11" ry="16"></ellipse> <!-- 左中央の指を縦長の楕円で描く -->

                <ellipse cx="61" cy="20" rx="11" ry="16"></ellipse> <!-- 右中央の指を縦長の楕円で描く -->

                <ellipse cx="81" cy="31" rx="11" ry="16" transform="rotate(18 81 31)"></ellipse> <!-- 右端の指を少し外側へ傾けて描く -->

                <path
                    d="
                        M 50 38
                        C 40 38, 35 46, 31 53
                        C 28 58, 24 61, 24 68
                        C 24 78, 33 80, 41 77
                        C 47 75, 53 75, 59 77
                        C 67 80, 76 78, 76 68
                        C 76 61, 72 58, 69 53
                        C 65 46, 60 38, 50 38
                        Z
                    "
                ></path> <!-- 二枚目の画像に近い、上側がくびれた大きな肉球部分を描く -->

            </svg> <!-- 肉球SVGを終了する -->

        </div> <!-- 肉球型の選択表示を終了する -->

        <a href="{{ url_for('home') }}" data-index="0"> <!-- ホーム画面へ移動するリンク -->
            <span>ホーム</span> <!-- ナビゲーションにホームと表示する -->
        </a>

        <a href="{{ url_for('pets') }}" data-index="1"> <!-- ペット画面へ移動するリンク -->
            <span>ペット</span> <!-- ナビゲーションにペットと表示する -->
        </a>

        <a href="{{ url_for('calendar') }}" class="active" data-index="2"> <!-- カレンダー画面へ移動するリンク -->
            <span>カレンダー</span> <!-- ナビゲーションにカレンダーと表示する -->
        </a>

        <a href="{{ url_for('records') }}" data-index="3"> <!-- 記録画面へ移動するリンク -->
            <span>記録</span> <!-- ナビゲーションに記録と表示する -->
        </a>

        <a href="{{ url_for('reservation') }}" data-index="4"> <!-- 予約画面へ移動するリンク -->
            <span>予約</span> <!-- ナビゲーションに予約と表示する -->
        </a>

    </nav> <!-- 下部ナビゲーションを終了する -->

    <script src="{{ url_for('static', filename='js/nav.js') }}"></script> <!-- ナビゲーション用JavaScriptを読み込む -->

</body> <!-- body部分を終了する -->

</html> <!-- HTML全体を終了する -->
